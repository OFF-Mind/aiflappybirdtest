name: Maestro UI Tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment results on'
        required: false
  push:
    branches:
      - main

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator and Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash -c 'curl -Ls "https://get.maestro.mobile.dev" | bash && export PATH="$PATH:$HOME/.maestro/bin" && ./gradlew assembleDebug && adb install app/build/outputs/apk/debug/app-debug.apk && (ls .maestro/flows/*.yaml 2>/dev/null && maestro test .maestro/flows/ --format junit --output maestro-results.xml || (echo "No Maestro flows found" && echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><testsuites/>" > maestro-results.xml))'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-results.xml

      - name: Comment PR with results
        if: github.event.inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f maestro-results.xml ]; then
            FAILURES=$(grep -c 'failure' maestro-results.xml || echo 0)
            if [ "$FAILURES" -eq "0" ]; then
              RESULT="✅ All Maestro UI tests passed"
            else
              RESULT="❌ Maestro UI tests failed ($FAILURES failures)"
            fi
          else
            RESULT="⚠️ No test results found"
          fi
          gh pr comment ${{ github.event.inputs.pr_number }} --body "$RESULT"
