name: Maestro UI Tests

on:
  pull_request:
    paths:
      - '.maestro/**'

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator and Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash -c 'curl -Ls "https://get.maestro.mobile.dev" | bash && export PATH="$PATH:$HOME/.maestro/bin" && ./gradlew assembleDebug && adb install app/build/outputs/apk/debug/app-debug.apk && (ls .maestro/flows/*.yaml 2>/dev/null && maestro test .maestro/flows/ --format junit --output maestro-results.xml || (echo "No Maestro flows found" && echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><testsuites/>" > maestro-results.xml))'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-results.xml
